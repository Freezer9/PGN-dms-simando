services:
  api:
    build:
      context: .
      dockerfile: Api/Dockerfile
    expose:
      - "8080"
    networks:
      - caddy
    environment:
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER:-simando}
      - Jwt__Audience=${JWT_AUDIENCE:-simando}
    volumes:
      - api_data:/app/Data
      - api_uploads:/app/wwwroot/uploads
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Frontend/Dockerfile
    expose:
      - "8080"
    networks:
      - caddy
    environment:
      - Api__BaseUrl=http://api:8080
    depends_on:
      - api
    restart: unless-stopped

volumes:
  api_data:
  api_uploads:

networks:
  caddy:
    external: true
