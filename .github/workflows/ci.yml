name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (.NET 10)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No packages.lock.json files are committed (central package management
      # instead, see Directory.Packages.props) -- key the restore cache off
      # the version manifest and csproj files instead.
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Restore
        run: dotnet restore Simando.slnx

      - name: Build
        run: dotnet build Simando.slnx --no-restore --configuration Release

      # Simando.Integration.Tests spins up real Postgres/PostGIS and an
      # S3-compatible store via Testcontainers -- needs the Docker daemon,
      # which GitHub-hosted ubuntu runners provide out of the box.
      - name: Test
        run: dotnet test Simando.slnx --no-build --configuration Release

  frontend:
    name: Frontend (React / Bun)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint and typecheck
        run: bun run check

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
